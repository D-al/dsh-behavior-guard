; llama-server 路由模式配置（一个进程，按请求里的 model 字段按需加载）
; 用法: llama-server --models-preset 本文件 --models-max 1 --models-memory-margin 450
; 说明: [*] 是全局默认，各模型段里的同名键会覆盖全局。
;   —— 与 .env.llama 的单一模型参数保持一致，只是把"每模型不同"的两项
;      （n-cpu-moe / moe-cache-mib）下沉到各自小节。

version = 1

[*]
parallel = 1
ctx-size = 98304
flash-attn = on
cache-type-k = q8_0
cache-type-v = q4_0
threads = 8
batch-size = 4096
ubatch-size = 2048
load-mode = none
prio = 2
n-gpu-layers = 99
fit = off
mmproj = D:/GGUF_Download/Qwen3.6-35B-A3B-mmproj-F16.gguf
mmproj-offload = true
spec-type = draft-mtp
; 投机草稿长度：5 为实测峰值（8 会挤爆 MTP scratch，客户端连接被中断）
spec-draft-n-max = 5
; p_min：0.8 为实测最优（0.9 速度相同但均长更短，0.7 更差）
spec-draft-p-min = 0.8
spec-ngram-simple-size-n = 12
spec-ngram-simple-size-m = 32
spec-ngram-simple-min-hits = 2
# 2026-11-18 与 .env.llama 对齐（此前 -1 无限制：.env 一旦失效会失控思考）。
# llama.cpp 预算语义：未达到预算零成本（模型自己早停），超限才强制封思考——
# 所以上限是"熔断"不是"分配"，设 4096 不让简单任务变慢（Tuner's Gift 实测：512 即够事实类，0 会精度降）。
reasoning-budget = 4096
reasoning-budget-message = （思考到此，下面直接用中文回答。）
reasoning-format = deepseek-legacy
temp = 0.7
top-p = 0.95
chat-template-file = D:/Brain/workspace/bench/chat_template_zh.jinja
repeat-penalty = 1.1
repeat-last-n = 512
dry-multiplier = 0.8
dry-base = 1.75
dry-allowed-length = 32
dry-penalty-last-n = 512
ctx-checkpoints = 2
cache-ram = 0
no-cache-idle-slots = true
log-verbosity = 3
image-max-tokens = 1024
; 启动时不预加载，等第一个请求来再加载（省启动时间）
load-on-startup = false

; ── Q4：长任务/交付（步数少、思考省，单步略慢）────────────────────
[Qwen3.6-35B-A3B-UD-Q4_K_XL]
model = D:/GGUF_Download/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
; Q4 的最优温度（2026-11-11 实测，P5 三次 447/389/524s 全过）：
; 0.65 和 0.75 都会进入 LOOP（895s / 1751s），0.9 直接 3 步崩。**这个值很尖，不要随手改**。
temp = 0.7
# 2026-11-18 与 .env.llama 对齐（config_check.py 检出：此前 41/900 是旧基线，
# .env 失效时会退回旧配置）。生产值以 .env 为准：NCMOE=40 / MOE_CACHE_MIB=1350。
n-cpu-moe = 40
moe-cache-mib = 1350
