meta:
  schema_version: 1
  generated: '2026-11-21'
  authority: ROADMAP_GRAPH.md
  semantic_mirror: CAPABILITY_LADDER.yaml
  human_view: ROADMAP.md
  reader: tools/roadmap_check.py
  judge_principle: ADR-0012 确定性优先；零 LLM；过滤测试 sid
state_machine:
  states:
  - backlog
  - ready
  - doing
  - done
  - manual-blocked
  transitions:
  - from: backlog
    to: ready
    when: all deps status==done AND (autonomous==true OR human_unblocked)
    actor: roadmap_check.py
  - from: ready
    to: doing
    when: selected as next climbable item (lowest risk, deps satisfied)
    actor: agent
    side_effect: trace({kind:'ladder_enter', id, ts}); 改本文件 status + entered_at
  - from: doing
    to: done
    when: 'verify.all_pass AND (autonomous==true ? auto : human_approved_diff)'
    actor: roadmap_check.py
    side_effect: trace({kind:'ladder_done', id, evidence}); status=done + done_at
      + evidence
  - from: doing
    to: ready
    when: verify.fail OR rollback
    actor: roadmap_check.py
    side_effect: trace({kind:'ladder_fail', id, reason}); attempts+=1; 回滚到 entered
      前快照
  - from: doing
    to: manual-blocked
    when: verify 含 human-judged 判据 OR risk==high
    actor: roadmap_check.py
    side_effect: 等人工；人不批则永久 manual-blocked
  climb_rule: 每轮从 status==ready 的集合里选 autonomous==true、risk 最低、deps 全 done 的一项；无则停并报告。
  fail_policy: attempts>=3 连续失败 → manual-blocked + 告警，不再重试（防死循环烧 token）
  rollback: doing 前 cp 目标文件到 snapshots/<ts>/；verify fail 自动恢复 + trace({kind:'rollback'})
verify_kinds:
- file_exists
- file_grep
- test_pass
- trace_count
- trace_absent
- json_field
- gate_result
- manual
completed_anchors:
  ground:
    status: done
    note: 地基 v2.8-v2.12：outcome/GWT/安全规则
  S1_data:
    status: done
    artifact: _evidence_bundle.json
    note: 8147 行 trace 聚类
  GWT_FEP:
    status: done
    verify: test_gwt_fep.mjs 9/9 + trace kind fep_cycle>0
  M4_budget:
    status: done
    verify: test_injection_budget.mjs 5/5
  S1_p0p2:
    status: done
    verify: self_harness_gate.py 10/10 + candidate-1.json
  CritBank:
    status: done
    verify: _critbank_state.json 真实计数
  S6_rule:
    status: done
    verify: test_injection_scan.mjs 6/6 + trace kind injection_hit>0
    note: 规则层已在线，模型层 86M 未做
