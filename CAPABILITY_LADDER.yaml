# ============================================================
# CAPABILITY LADDER — agent 自读能力阶梯 / 成长手册（机器可读 + 人类可读）
# ============================================================
# 用户目标（2026-11-20）：把路线图切成"它能一步步爬上去的、它自己可读的形式"，
# 让 agent 顺着这条路自己成长；每张卡片回答 what/why/unlocks/benefit/cost/caveats/reflection。
# 设计说明：docs/GROWTH_CARD_DESIGN_20261120.md
#
# 读法：
#   agent  → tools/roadmap_check.py 解析本文件 → --next 选卡 → 跑 verify → 写回 status
#   人     → 读 ROADMAP.md（人类视图）；本文件是机器真相源
# 权威源：CAPABILITY_LADDER.yaml（不是 ROADMAP.md，不是 p/bench 副本）
# 判据原则：ADR-0012 零 LLM——文件/trace/单测/gate；过滤测试 sid
# 安全：autonomous=true 必须 verify 全确定性 + risk=low；闸门上移未取消
# ============================================================

meta:
  schema_version: 1
  generated: '2026-11-20'
  authority: CAPABILITY_LADDER.yaml
  human_view: ROADMAP.md
  reader: tools/roadmap_check.py
  judge_principle: ADR-0012 确定性优先；零 LLM；过滤测试 sid
  test_sids:
  - s1
  - outcome-
  - budget-1
  - budget-2
  - budget-3
  - budget-4
  - b7332eb6
  - r
  - fb
  - b
  - inject-test
state_machine:
  states:
  - backlog
  - ready
  - doing
  - done
  - manual-blocked
  transitions:
  - from: backlog
    to: ready
    when: all deps status==done AND (autonomous==true OR human_unblocked)
    actor: roadmap_check.py
  - from: ready
    to: doing
    when: selected as next climbable item (lowest risk, deps satisfied)
    actor: agent
    side_effect: trace({kind:'ladder_enter', id, ts}); 改本文件 status + entered_at
  - from: doing
    to: done
    when: 'verify.all_pass AND (autonomous==true ? auto : human_approved_diff)'
    actor: roadmap_check.py
    side_effect: trace({kind:'ladder_done', id, evidence}); status=done + done_at
      + evidence
  - from: doing
    to: ready
    when: verify.fail OR rollback
    actor: roadmap_check.py
    side_effect: trace({kind:'ladder_fail', id, reason}); attempts+=1; 回滚到 entered
      前快照
  - from: doing
    to: manual-blocked
    when: verify 含 human-judged 判据 OR risk==high
    actor: roadmap_check.py
    side_effect: 等人工；人不批则永久 manual-blocked
  climb_rule: 每轮从 status==ready 的集合里选 autonomous==true、risk 最低、deps 全 done 的一项；无则停并报告。
  fail_policy: attempts>=3 连续失败 → manual-blocked + 告警，不再重试（防死循环烧 token）
  rollback: doing 前 cp 目标文件到 snapshots/<ts>/；verify fail 自动恢复 + trace({kind:'rollback'})
verify_kinds:
- file_exists
- file_grep
- test_pass
- trace_count
- trace_absent
- json_field
- gate_result
- manual
completed_anchors:
  ground:
    status: done
    note: 地基 v2.8-v2.12：outcome/GWT/安全规则
  S1_data:
    status: done
    artifact: _evidence_bundle.json
    note: 8050 行 trace 聚类
  GWT_FEP:
    status: done
    verify: test_gwt_fep.mjs 9/9 + trace kind fep_cycle>0
  M4_budget:
    status: done
    verify: test_injection_budget.mjs 5/5
  S1_p0p2:
    status: done
    verify: self_harness_gate.py 10/10 + candidate-1.json
  CritBank:
    status: done
    verify: _critbank_state.json 真实计数
  S6_rule:
    status: done
    verify: test_injection_scan.mjs 6/6 + trace kind injection_hit>0
    note: 规则层已在线，模型层 86M 未做
items:
- id: M1
  title: 情景检索进主循环
  tier: 1
  deps:
  - ground
  - S1_data
  - GWT_FEP
  risk: low
  autonomous: true
  status: ready
  requires_new_instrument: 本任务必须先埋 evidence_cited trace kind（否则判据永远是鸡生蛋）
  verify:
  - kind: file_grep
    path: index.mjs
    regex: es\.exe.*top-3|ES_EXE.*top3
    min: 1
  - kind: file_grep
    path: index.mjs
    regex: 'kind: ''evidence_cited'''
    min: 1
    note: 埋点存在性
  - kind: trace_count
    source: _trace.jsonl
    kind_name: evidence_cited
    sid_filter: exclude_tests
    min: 1
    note: 埋点后真实会话跑一次
  unlock:
  - L1
  human_note: 原 DoD'被主动引用>0次'是主观的；改造为可机读埋点后再验，埋点本身属本任务交付
  what: 把离线 es.exe 检索接进控制回合，长任务里自动注入 top-3 历史经验
  why: 历史经验现在躺在 trace/日志里靠人肉搬运；长任务反复踩同样的坑，缺"想起来"这一环
  benefit_to_self: 以后遇到"这错误我见过"能真的想起来，少走 D1 重复探测的弯路
  caveats:
  - evidence_cited 埋点必须由本任务一起做，否则判据永远 FAIL（鸡生蛋）
  - 检索只进控制回合，不占运行时注入通道（ADR-0017：FEP 曾挤掉 D5 额度）
  - 过滤测试 sid，否则检索到 s1 假经验
  reflection:
  - 注入的 3 条里有几条真被后续动作引用？没被引用的为什么没用？
  - 有没有"想起来的经验是错的/过时的"？怎么进可控遗忘？
  abort_if: D5 审计额度被挤占，或长任务 token 增幅>10% 且无质量提升
- id: M8
  title: 轨迹 FSM 监控器
  tier: 1
  deps:
  - S1_data
  risk: low
  autonomous: true
  status: ready
  requires_new_instrument: 需新建 eval_fsm.py 与 _fsm_eval.json（判据产物由本任务自己生成）
  verify:
  - kind: file_exists
    path: tools/eval_fsm.py
  - kind: json_field
    path: _fsm_eval.json
    field: heldout_auc
    op: '>='
    value: 0.85
  - kind: file_grep
    path: index.mjs
    regex: fsm.*signal|FSM_SIGNAL
    min: 1
  unlock:
  - L6
  human_note: AUROC 判据需新建 eval_fsm.py；本机纯统计无显存
  what: 把 8050 行 trace 压成 FSM，做局部失败预测（重复探测/路径解析/工具报错）
  why: 长轨迹因果归因交主模型只有 0.56≈随机；但局部可观察信号（FSM）实测 AUROC 0.94，是可靠的前置预警
  benefit_to_self: 能在卡住的早期就知道"这个模式会导致失败"，提前换路，不用烧完 10 步才发现
  caveats:
  - 只做局部信号，别碰长轨迹因果归因（Jev 实测≈随机）
  - 判据产物 eval_fsm.py/_fsm_eval.json 由本任务自己生成
  - AUROC<0.85 不算完成，别降标准
  reflection:
  - FSM 预警的误报是什么模式？误报比漏报更伤吗？
  - 哪些失败签名是 FSM 抓不到、必须交主模型的？
  abort_if: held-out AUROC<0.85 反复达不到，或预警侵入运行时注入通道
- id: M3
  title: 用户意图 BDI 三槽
  tier: 2
  deps:
  - GWT_FEP
  risk: med
  autonomous: false
  status: backlog
  requires_new_instrument: 需新建 test_bdi_slots.mjs；intent_drift 已在 index.mjs:1893 定义（真实
    trace 待补）
  verify:
  - kind: file_exists
    path: tools/test_bdi_slots.mjs
  - kind: test_pass
    cmd: node tools/test_bdi_slots.mjs
    min: 5
  - kind: trace_count
    source: _trace.jsonl
    kind_name: mind_state
    sid_filter: exclude_tests
    min: 1
    note: BDI 三槽写进现有 mind_state kind，不新造 kind
  unlock:
  - M9
  - L1
  human_note: 改 index.mjs 的 bdi 状态结构，需人工确认（非白名单细粒度 target）
  what: 把 s.bdi 单槽升级成 belief/desire/intention 三槽，承载用户意图跨压缩不丢
  why: 单槽装不下"用户要什么/信什么/打算怎么做"，压缩后约束丢失，意图漂移检测无状态可依
  benefit_to_self: 长任务压缩后仍记得用户最初要什么，不会因为 context 缩短而跑偏
  caveats:
  - 改 index.mjs 的 bdi 状态结构，不在白名单细粒度 target 内 → 人工确认
  - 复用现有 mind_state kind 埋点，别新造 kind
  - 用户意图多轮冲突时以最新指令为准（ADR-0014 不质疑式干预）
  reflection:
  - 三槽里哪一槽最常在压缩后丢失？
  - 有没有把用户临时指令误当长期意图的情况？
  abort_if: bdi 结构改动导致现有 control_turn/FEP 断言回归
- id: M9
